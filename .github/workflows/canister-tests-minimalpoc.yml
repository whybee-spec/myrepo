name: Canister tests lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest

    steps:
      - name: Create harmless marker
        env:
          LABEL: ${{ github.event_name == 'pull_request' && 'ATTACKER_CONTROLLED' || 'LEGITIMATE' }}
          SOURCE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          printf 'LABEL=%s\nSOURCE=%s\nEVENT=%s\n' \
            "$LABEL" "$SOURCE" "$GITHUB_EVENT_NAME" \
            > internet_identity_backend.wasm.gz

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: internet_identity_backend.wasm.gz
          path: internet_identity_backend.wasm.gz
