name: Canister tests lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Create marker
        run: echo "CHANGEDDD" > internet_identity_backend.wasm.gz

      - uses: actions/upload-artifact@v4
        with:
          name: internet_identity_backend.wasm.gz
          path: internet_identity_backend.wasm.gz
