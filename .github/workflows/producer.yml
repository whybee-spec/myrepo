name: Artifact producer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Create harmless marker
        env:
          SOURCE_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          printf 'source=%s\nbranch=%s\nevent=%s\n' \
            "$SOURCE_REPO" "$SOURCE_BRANCH" "$GITHUB_EVENT_NAME" \
            > internet_identity_backend.wasm.gz

      - uses: actions/upload-artifact@v4
        with:
          name: internet_identity_backend.wasm.gz
          path: internet_identity_backend.wasm.gz
          retention-days: 2
