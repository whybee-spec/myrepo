name: deploy-rc
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { ...context.repo, name: "internet_identity_backend.wasm.gz" }
            );
            const selected = artifacts
              .filter(a => !a.expired)
              .filter(a => a.workflow_run?.head_branch === "main")
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];

            if (!selected) throw new Error("No matching artifact");

            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: selected.workflow_run.id
            });

            core.info(JSON.stringify({
              artifact_id: selected.id,
              branch: selected.workflow_run.head_branch,
              source: run.head_repository?.full_name,
              event: run.event,
              source_is_fork:
                selected.workflow_run.head_repository_id !== repo.id
            }, null, 2));
