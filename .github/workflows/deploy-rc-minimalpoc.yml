name: Deploy RC dry run

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - name: Select artifact using DFINITY's rule
        id: pick
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                ...context.repo,
                name: "internet_identity_backend.wasm.gz"
              }
            );

            const selected = artifacts
              .filter(a => !a.expired)
              .filter(a => a.workflow_run?.head_branch === "main")
              .sort((a, b) =>
                new Date(b.updated_at) - new Date(a.updated_at)
              )[0];

            if (!selected) throw new Error("No matching artifact");

            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: selected.workflow_run.id
            });

            core.info(`Selected artifact ID: ${selected.id}`);
            core.info(`Branch: ${selected.workflow_run.head_branch}`);
            core.info(`Event: ${run.event}`);
            core.info(`Source: ${run.head_repository?.full_name}`);

            core.setOutput("run_id", String(selected.workflow_run.id));

      - name: Download selected artifact
        uses: actions/download-artifact@v4
        with:
          name: internet_identity_backend.wasm.gz
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ github.token }}
          path: selected

      - name: Show selected content
        run: cat selected/internet_identity_backend.wasm.gz
